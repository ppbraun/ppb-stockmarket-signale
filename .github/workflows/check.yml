name: Signal Check

on:
  schedule:
    # Alle 30 Min. zwischen 5:00 und 20:30 UTC — das deckt 7–21 Uhr Europe/Berlin
    # sowohl in Winter- (UTC+1) als auch Sommerzeit (UTC+2) ab. Die exakte
    # Entscheidung, ob wirklich gecrawlt wird, trifft check_signals.py selbst
    # anhand der lokalen Zeitzone (DST-sicher) — Läufe außerhalb von 7–21 Uhr
    # lokal brechen sofort ab, ohne irgendeine externe API anzufassen.
    - cron: '0,30 5-20 * * *'
  workflow_dispatch:          # erlaubt manuellen Start über den "Actions"-Tab

permissions:
  contents: write             # nötig, damit der Job data/last_state.json aktualisieren darf

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # Sicherheitsnetz: Job wird notfalls abgebrochen statt den nächsten Takt zu blockieren
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Signale prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: python -u scripts/check_signals.py

      - name: Aktualisierten Stand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_state.json docs/data.json
          git diff --staged --quiet || git commit -m "Update signal state"
          git push
