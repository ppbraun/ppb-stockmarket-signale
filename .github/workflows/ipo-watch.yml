name: ipo-watch

on:
  schedule:
    - cron: "7 5-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ipo.txt

      - run: pip install -r requirements-ipo.txt

      - name: IPO-Radar
        run: python ipo_watch.py
        env:
          IPO_CHAT_ID: ${{ secrets.IPO_CHAT_ID }}
          SEC_UA: ${{ secrets.SEC_UA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IPO_IGNORE_WINDOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Zustand sichern
        run: |
          git config user.name "ppb-bot"
          git config user.email "bot@users.noreply.github.com"
          cp ipo_state.json /tmp/ipo_state.json
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ipo_state.json ipo_state.json
            git add ipo_state.json
            if git diff --staged --quiet; then
              echo "Keine Änderung am Zustand."
              exit 0
            fi
            git commit -m "ipo state"
            if git push; then
              exit 0
            fi
            echo "Push abgelehnt, neuer Versuch $i"
            sleep 3
          done
          exit 1
