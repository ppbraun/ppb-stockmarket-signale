name: ipo-watch

on:
  schedule:
    # stündlich; das Fenster 7 bis 21 Uhr Berlin prüft das Skript selbst (Sommer-/Winterzeit)
    - cron: "7 5-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ipo.txt

      - run: pip install -r requirements-ipo.txt

      - name: IPO-Radar
        run: python ipo_watch.py
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # manueller Start ignoriert das Zeitfenster
          IPO_IGNORE_WINDOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Zustand sichern
        run: |
          git config user.name "ppb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ipo_state.json
          if git diff --staged --quiet; then
            echo "Keine Änderung am Zustand."
            exit 0
          fi
          git commit -m "ipo state"
          git pull --rebase
          git push
